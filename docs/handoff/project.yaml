    request: |
      Add two selectable UI themes
      
      A — Midnight Coral
      
      - Background: Near-black "#0D0F12"
      - Cards: Charcoal "#222629"
      - Accents: Coral "#FF907B"
      - Featured cards: Peach-to-coral gradients
      - Text: White "#F7F5F3"
      - Style: Minimal, sophisticated, discreet. Bold headings, rounded cards, subtle shadows and clean navigation.
      
      E — After Hours
      
      - Background: Deep purple "#17091F"
      - Cards: Dark violet "#290D3B"
      - Accents: Electric lime "#DCFF40"
      - Featured cards: Purple-pink gradients "#C674F5" → "#E18AF9"
      - Buttons: Lavender "#EBB4FA"
      - Text: White "#FAF4FF"
      - Style: Bold, playful, nightlife-inspired. Oversized headings, neon highlights, glowing accents and rounded cards.
      
      Add both under Settings → Appearance → App Theme, with previews and persistent selection. Apply the selected design throughout ButtMate.
      
      2. AI Cartoon Avatar Maker
      
      Expand the existing Avatar Maker so users can upload photos and generate recognisable cartoon versions of themselves or other people whose photos they have permission to process.
      
      Include 12 styles: Original Cartoon, Studio Ghibli, Bob's Burgers, Disney 2D, Hilda, Gravity Falls, Adventure Time, The Simpsons, South Park, Family Guy, Rick and Morty, Futurama.
      
      Each style must have genuinely distinct facial proportions, linework, shading and colours.
      
      Features:
      
      - Upload multiple reference photos.
      - Generate headshots or full-body characters.
      - Compare styles side by side.
      - Edit clothing, hair, pose and expression.
      - Preview, regenerate and save profile pictures.
      - Support transparent backgrounds.
      
      3. Global Cartoon Style
      
      Add Settings → Appearance → Cartoon Avatar Style.
      
      Selecting one style must make every generated profile avatar throughout ButtMate use that same style, including People, Roster, Calendar and profile screens.
      
      For example, selecting The Simpsons makes all saved people appear as Simpsons-inspired characters. Switching to Disney changes them all to Disney-inspired characters.
      
      Preserve each person's likeness and original photos. Cache generated styles for instant reuse. Keep this setting independent of the two UI themes.
      
      4. Implementation
      
      Integrate an image-generation API such as OpenAI Images through a secure backend. Require permission for processing other people's photos.
      
      Reuse existing ButtMate pages, components and data. Create and connect only missing functionality.
