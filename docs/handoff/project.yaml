name: ButtMate
description: "Help me design a system that can schedule and create a “roster” by extracting context, facts, times and personality/attribute‑specific information from screenshots. The system should organise and plan meet‑ups with ongoing sexual partners, manage the sexual schedule of a monogamous relationship (including a “I’m good to go” button that indicates a receptive gay partner is douched and cleaned), and make “spontaneous” sex cleaner and easier without the need for “dirty prep talk”. It should also be able to schedule a fleet of random one‑night stands by allocating when I’m free and how much prep time is needed (visible only to me), so that flaking because I’m not ready is no longer an issue. The tool should work for personal tracking or allow me to share availability with someone else so they can decide scheduling with ease, without revealing my sexual body count. Include all these features and constraints in the design."
